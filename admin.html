<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — Sanmilita Yuvak Sangha</title><style>body{margin:0;background:#f5efe2;color:#191512;font-family:system-ui,sans-serif}button,input{font:inherit}.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}aside{background:#1c1714;color:#fff;padding:24px;display:flex;flex-direction:column;gap:10px}aside h2{font-family:Georgia,serif;margin:0 0 20px}aside button{background:transparent;color:#ddd;border:0;text-align:left;padding:11px;border-radius:8px;cursor:pointer}aside button.active,aside button:hover{background:#8d1720;color:#fff}.logout{margin-top:auto}.main{padding:34px;max-width:1200px;width:100%;margin:auto}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:15px}.stat,.panel{background:#fffaf0;border:1px solid #ddd2bf;padding:20px;box-shadow:0 10px 35px #0000000b;border-radius:10px}.stat span{display:block;color:#777}.stat b{font:700 38px Georgia}.panel{margin-top:20px}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.form label,.form input,.form textarea,.form select{display:block}.form input,.form textarea,.form select{width:100%;padding:12px;border:1px solid #cfc3ae;background:#fff}.primary{background:#8d1720;color:#fff;border:0;padding:12px 18px;cursor:pointer}.danger{background:#8d1720;color:#fff;border:0;padding:7px 10px;cursor:pointer}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid #ddd;text-align:left}.hidden{display:none!important}@media(max-width:800px){.shell{grid-template-columns:1fr}aside{position:sticky;top:0;z-index:2;flex-direction:row;overflow:auto}aside h2{display:none}.grid{grid-template-columns:repeat(2,1fr)}.form{grid-template-columns:1fr}.main{padding:18px}}

.upload-box{grid-column:1/-1}.upload-box>label{display:block;font-weight:700;margin-bottom:7px}.upload-row{display:flex;gap:10px;align-items:center;margin-top:8px}.image-file{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}.upload-btn{background:#201a16;color:#fff;border:0;padding:12px 16px;cursor:pointer;border-radius:6px}.upload-btn:disabled{opacity:.6}.upload-status{font-size:12px;color:#756e63;margin-top:7px;min-height:18px}.upload-preview{display:block;margin-top:10px;width:140px;height:100px;object-fit:cover;border:1px solid #ddd2bf;border-radius:7px}.check-field{display:flex!important;align-items:center;gap:8px}.check-field input{width:auto!important}
</style></head><body><div class="shell"><aside><h2>SYSC Admin</h2><button data-view="dashboard">Dashboard</button><button data-view="content">Content</button><button data-view="contact">Contact</button><button data-view="events">Events</button><button data-view="gallery">Gallery</button><button data-view="team">Team</button><button data-view="news">News</button><button data-view="memberships">Memberships</button><button id="logout" class="logout">Logout</button></aside><main class="main"><h1 id="viewTitle">Dashboard</h1><div id="login" class="panel"><h2>Admin Login</h2><form id="loginForm" class="form"><input name="email" type="email" placeholder="Admin email" required><input name="password" type="password" placeholder="Password" required><button class="primary">Login</button></form><p id="loginMsg"></p></div><div id="app" class="hidden"><div id="view"></div></div></main></div><script src="/admin.js"></script></body></html>
